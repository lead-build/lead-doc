# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

# Set the OS, Python version, and other tools you might need
build:
  os: ubuntu-24.04
  tools:
    python: "3.13"
  # Read the Docs has no native ProperDocs support, so override the build
  # steps. Without a mkdocs/sphinx section, python.install is not run either,
  # so install the requirements explicitly.
  jobs:
    install:
      - pip install -r requirements.txt
    build:
      html:
        - python -m properdocs build --clean --site-dir $READTHEDOCS_OUTPUT/html --config-file properdocs.yml
